/* =====================================================================
   HATCH — single-file product prototype.
   The `DB` module below is a persistence layer whose methods map 1:1 to

===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;

function rng(seed){let t=seed;return()=>((t=(t*9301+49297)%233280)/233280)}
function det(str){let h=9;for(const c of str)h=(h*31+c.charCodeAt(0))>>>0;return rng(h)}
function fmt(n){return n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e3?(n/1e3).toFixed(1).replace('.0','')+'K':''+Math.round(n)}
function ago(ts){const d=Date.now()-ts;if(d<DAY)return Math.max(1,Math.round(d/36e5))+'h ago';if(d<30*DAY)return Math.round(d/DAY)+'d ago';return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}

function comicArtwork(story,index=0){const start=Math.floor(det((story.slug||story.id)+'-public-domain-comic-art')()*COMIC_ART.length);return COMIC_ART[((start+index)%COMIC_ART.length+COMIC_ART.length)%COMIC_ART.length]}

function novelBody(seed){
  const r=det(seed);const ps=[];ps.push(OPENINGS[Math.floor(r()*OPENINGS.length)]);
  const pool=[...POOL];for(let i=pool.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  const n=4+Math.floor(r()*3);for(let i=0;i<n;i++)ps.push(pool[i%pool.length]);
  return ps.map(p=>'<p>'+esc(p)+'</p>').join('');
}

/* charts — hand-drawn SVG, interactive via native tooltips */
function lineChart(data,{w=560,h=170,color='var(--acc)',labels}={}){
  const max=Math.max(...data)*1.15||1,pad=8;
  const pts=data.map((v,i)=>[pad+i*(w-pad*2)/(data.length-1),h-14-(v/max)*(h-34)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
    ${[.25,.5,.75].map(f=>`<line x1="${pad}" x2="${w-pad}" y1="${14+f*(h-34)}" y2="${14+f*(h-34)}" stroke="var(--line2)"/>`).join('')}
    <path d="${path} L${pts.at(-1)[0]},${h-14} L${pts[0][0]},${h-14}Z" fill="${color}" opacity=".1"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="transparent"><title>${labels?labels[i]:i} — ${fmt(data[i])}</title></circle>`).join('')}
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="${color}"/>`).join('')}
  </svg>`}
function series(seed,n,base,grow){const r=det(seed);let v=base;return Array.from({length:n},(_,i)=>{v=Math.max(1,v*(1+grow)+ (r()-.45)*base*.25);return Math.round(v)})}

function startMovingRails(){
  cancelAnimationFrame(window.__railFrame);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  $$('.rail').forEach(rail=>{
    if(!rail.dataset.looped){
      rail.insertAdjacentHTML('beforeend',rail.innerHTML);
      rail.dataset.looped='1';
    }
    rail.classList.add('moving');
    const overflow=rail.scrollWidth>rail.clientWidth+4;
    $$(`[data-id="${rail.id}"]`).forEach(b=>{b.style.display=overflow?'':'none'});
  });
  if(reduce)return;
  const tick=()=>{
    $$('.rail.moving').forEach(rail=>{
      if(rail.closest('.railwrap')?.matches(':hover'))return;
      if(Date.now()<+rail.dataset.pauseUntil)return;
      const half=rail.scrollWidth/2;
      if(half<=rail.clientWidth)return;
      rail.scrollLeft+=0.22;
      if(rail.scrollLeft>=half)rail.scrollLeft-=half;
    });
    window.__railFrame=requestAnimationFrame(tick);
  };
  window.__railFrame=requestAnimationFrame(tick);
}
function startHeroBanner(){
  const slides=$$('.hero-banner-slide');
  if(!slides.length)return;
  const banner=document.querySelector('.feature-banner');
  const countEl=document.querySelector('.feature-count');
  const controls=$$('.feature-arrow');
  const titleEl=document.getElementById('feature-title');
  const badgesEl=document.getElementById('feature-badges');
  const episodeEl=document.getElementById('feature-episode');
  const descEl=document.getElementById('feature-desc');
  const copyEl=document.getElementById('feature-copy');
  let index=0;
  const syncText=(i)=>{
    const slide=slides[i];
    if(!slide||!titleEl||!episodeEl||!descEl||!badgesEl||!copyEl)return;
    const title=slide.dataset.title||'';
    const badge1=slide.dataset.badge1||'';
    const badge2=slide.dataset.badge2||'';
    const episode=slide.dataset.episode||'';
    const desc=slide.dataset.desc||'';
    const bg=slide.dataset.bg||'';
    if(banner && bg){
      banner.style.setProperty('--feature-bg-image', `url("${bg}")`);
    }
    copyEl.classList.add('is-changing');
    setTimeout(()=>{
      titleEl.textContent=title;
      badgesEl.innerHTML=`<span class="feature-badge ${slide.dataset.href?'manga':'comic'}">${badge1}</span>${badge2?`<span class="feature-badge soft">${badge2}</span>`:''}`;
      episodeEl.textContent=episode;
      descEl.textContent=desc;
      const read=document.getElementById('feature-read');
      if(read&&slide.dataset.href){read.setAttribute('href',slide.dataset.href);read.setAttribute('target','_blank');read.setAttribute('rel','noopener noreferrer')}
      else if(read&&slide.dataset.id){read.setAttribute('href','#/story/'+slide.dataset.id);read.removeAttribute('target')}
      copyEl.classList.remove('is-changing');
    },180);
  };
  const show=(nextIndex)=>{
    index=(nextIndex+slides.length)%slides.length;
    slides.forEach((slide,i)=>slide.classList.toggle('active',i===index));
    if(countEl)countEl.textContent=`${index+1} / ${slides.length}`;
    syncText(index);
  };
  controls.forEach(btn=>{
    btn.onclick=()=>show(btn.dataset.heroNav==='next'?index+1:index-1);
  });
  clearInterval(window.__heroBannerTimer);
  window.__heroBannerTimer=setInterval(()=>show(index+1),2600);
  show(0);
}

function recommend(){
  let rationale=null,pool=db.stories();
  if(me){
    const keys=Object.keys(DB.progress).filter(k=>k.startsWith(me.id+':')).map(k=>k.split(':')[1]);
    const liked=Object.keys(DB.likes).filter(k=>DB.likes[k].includes(me.id));
    const seen=new Set([...keys,...liked]);
    const gcount={};pool.filter(s=>seen.has(s.id)).forEach(s=>s.genres.forEach(g=>gcount[g]=(gcount[g]||0)+1));
    const top=Object.entries(gcount).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    if(top.length){rationale=top[0];pool=pool.filter(s=>!seen.has(s.id)&&s.genres.includes(top[0]))}
    else pool=[];
  } else pool=[];
  if(pool.length<4){pool=db.stories().sort((a,b)=>b.views-a.views).slice(0,8);rationale=null}
  const html=`<section class="sect"><div class="shead"><div><span class="eyebrow">${rationale?`Because you read ${esc(rationale)}`:'Hand-picked for you'}</span><h2>${rationale?'You May Also Like':'Recommended For You'}</h2></div></div>
  ${rail(pool.slice(0,8).map(s=>storyCard(s)).join(''),'r-rec')}</section>`;
  return {html};
}

function dquery(){
  let S=db.stories();
  if(D.type==='comic'||D.type==='novel')S=S.filter(s=>s.type===D.type);
  if(D.type==='completed'||D.type==='ongoing')S=S.filter(s=>s.status===D.type);
  if(D.genres.size)S=S.filter(s=>s.genres.some(g=>D.genres.has(g)));
  if(D.q){const q=D.q.toLowerCase();S=S.filter(s=>s.title.toLowerCase().includes(q)||au(s).name.toLowerCase().includes(q)||s.genres.some(g=>g.toLowerCase().includes(q)))}
  const sort={trending:(a,b)=>b.views-a.views,reads:(a,b)=>b.views-a.views,updated:(a,b)=>b.updAt-a.updAt,new:(a,b)=>b.createdAt-a.createdAt,rated:(a,b)=>b.rating-a.rating};
  return S.sort(sort[D.sort]||sort.trending);
}

  $('#dsk').innerHTML=more?'':'';
  if(items.length>D.n){io&&io.disconnect();io=new IntersectionObserver(es=>{if(es[0].isIntersecting&&!D.busy&&D.n<items.length){D.busy=true;
    $('#dsk').innerHTML=`<div class="grid" style="margin-top:16px">${Array(4).fill('<div class="skel" style="aspect-ratio:2/3"></div>').join('')}</div>`;

  $('#dsk').innerHTML='';ic();
}

/* ================= LIBRARY ================= */
function libraryHTML(tab){
  const entries=Object.entries(DB.libs).filter(([k])=>k.startsWith(me.id+':')).map(([k])=>DB.stories.find(s=>s.id===k.split(':')[1])).filter(Boolean);
  const prog=Object.entries(DB.progress).filter(([k])=>k.startsWith(me.id+':')).map(([k,p])=>({s:DB.stories.find(x=>x.id===k.split(':')[1]),p})).filter(x=>x.s);
  const foll=Object.keys(DB.follows).filter(k=>k.startsWith(me.id+':')).map(k=>db.user(k.split(':')[1]));
  const hist=[...prog].sort((a,b)=>b.p.at-a.p.at);
  const tabs=[['reading','Currently Reading'],['bookmarked','Bookmarked'],['following','Following'],['history','History']];
  let body='';
  if(tab==='reading'){body=prog.length?`<div style="display:grid;gap:14px">${prog.map(({s,p})=>`<div class="librow"><img class="lth" src="${coverSrc(s)}"><div style="flex:1;min-width:0"><b style="font-family:var(--fd);font-size:17px">${esc(s.title)}</b><div style="font-size:12.5px;color:var(--mut);margin:3px 0 4px">${esc(au(s).name)} · Chapter ${p.ch} / ${db.chapters(s.id).length}</div><div class="pbar" style="max-width:340px"><i style="width:${p.pct*100}%"></i></div><div style="font-size:12px;color:var(--mut);margin-top:5px">${Math.round(p.pct*100)}% completed</div></div><a class="btn btn-acc btn-sm" href="#/read/${s.type}/${s.id}/${p.ch}">Continue</a></div>`).join('')}</div>`:emptyLib('book-open','Nothing in progress','Open any story and your progress will appear here automatically.')}
  else if(tab==='bookmarked'){body=entries.length?`<div class="grid">${entries.map(s=>storyCard(s,{prog:db.prog(s.id)})).join('')}</div>`:emptyLib('bookmark','No bookmarks yet','Tap the bookmark on any cover to keep it here.')}
  else if(tab==='following'){body=foll.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px">${foll.map(u=>creatorCard(u)).join('')}</div>`:emptyLib('users','Not following anyone','Follow creators to get notified about new chapters.')}
  else{body=hist.length?`<div class="rows">${hist.map(({s,p})=>`<a class="row" href="#/story/${s.id}"><span class="num"><i data-lucide="history" style="width:17px;height:17px"></i></span><div class="grow"><h4>${esc(s.title)}</h4><div class="meta">Ch. ${p.ch} · ${ago(p.at)}</div></div><a class="btn btn-out btn-sm" href="#/read/${s.type}/${s.id}/${p.ch}">Resume</a></a>`).join('')}</div>`:emptyLib('history','No reading history','Your trail will show up here.')}
  return `<div class="wrap" style="padding-top:34px;min-height:60vh">
    <span class="eyebrow">${esc(me.name)}</span><h1 style="font-size:clamp(26px,3.6vw,36px)">My Library</h1>
    <div class="ltabs" style="margin-top:22px">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" data-act="ltab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${body}
  </div>`+footerHTML();
}
function emptyLib(icon,h,p){return `<div class="empty"><i data-lucide="${icon}"></i><h3>${h}</h3><p>${p}</p><a class="btn btn-ink" style="margin-top:16px" href="#/discover">Browse stories</a></div>`}

function studioGate(){return `<div class="wrap"><div class="empty" style="padding:100px 20px"><i data-lucide="feather"></i><h3>Become a creator</h3><p>Publish your first comic or novel and the full Creator Studio unlocks — analytics, chapter tools, and an audience that subscribes to you, not an algorithm.</p><a class="btn btn-acc" style="margin-top:18px" href="#/studio/new">Create your first story</a></div></div>`+footerHTML()}
function barTop(s){

function pset(k,v){if(me){DB.prefs[me.id]=DB.prefs[me.id]||{};DB.prefs[me.id][k]=v;save()}}
function removeTarget(r){
  if(r.targetType==='story'){const s=DB.stories.find(x=>x.id===r.targetId);if(s)s.deleted=true}
  if(r.targetType==='comment'){const c=DB.comments.find(x=>x.id===r.targetId);if(c)c.deleted=true}
  if(r.targetType==='post'){const p=DB.posts.find(x=>x.id===r.targetId);if(p)p.deleted=true}
}
function targetOwner(r){const s=DB.stories.find(x=>x.id===r.targetId);return s?.author||null}

/* search */
function sSearch(q){
  const box=$('#sres');if(!box)return;q=q.trim().toLowerCase();
  if(!q){box.innerHTML=`<div class="sc">Trending searches</div>${['moonlight','kingdom','romance','horror'].map(t=>`<a href="#/discover?q=${t}"><i data-lucide="trending-up" style="width:15px;height:15px;color:var(--mut)"></i>${t}</a>`).join('')}`;ic();return}
  const st=db.stories().filter(s=>s.title.toLowerCase().includes(q)).slice(0,4);
  const us=DB.users.filter(u=>u.name.toLowerCase().includes(q)||u.username.includes(q)).slice(0,2);
  const gs=DB.genres.filter(g=>g.toLowerCase().includes(q)).slice(0,2);
  box.innerHTML=(st.length?`<div class="sc">Stories</div>`+st.map(s=>`<a href="#/story/${s.id}"><span class="sthumb" style="background-image:url(${coverSrc(s)})"></span><span><b style="font-size:14px">${esc(s.title)}</b><div style="font-size:12px;color:var(--mut)">${esc(au(s).name)} · ${s.type}</div></span></a>`).join(''):'')
  +(us.length?`<div class="sc">Authors</div>`+us.map(u=>`<a href="#/creator/${u.username}">${avatar(u,'sm')}<b style="font-size:14px">${esc(u.name)}</b><span style="font-size:12px;color:var(--mut)">${fmt(db.followers(u))} followers</span></a>`).join(''):'')
  +(gs.length?`<div class="sc">Genres</div>`+gs.map(g=>`<a href="#/discover?g=${encodeURIComponent(g)}"><i data-lucide="tag" style="width:15px;height:15px;color:var(--mut)"></i>${esc(g)}</a>`).join(''):'')
  ||`<div class="empty" style="padding:24px"><p>No matches for “${esc(q)}”.</p></div>`;ic();
}
document.addEventListener('input',e=>{if(e.target.id==='sinput')sSearch(e.target.value)});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='sinput'&&e.target.value.trim()){location.hash='#/discover?q='+encodeURIComponent(e.target.value.trim());$('#spanel').classList.remove('open')}
  if(e.key==='Escape'){$('#spanel')?.classList.remove('open');closeModal();closeDD()}
});

    const email=f.email.value.toLowerCase();
    const found=DB.users.find(u=>(u.email||'').toLowerCase()===email||u.username+'@hatch.ink'===email||u.username===email);
    if(!found)return toast('No account with that email — try a demo button below','alert-triangle');
    if(found.banned)return toast('This account has been suspended','shield');
    signIn(found.id)},
  signup(f){if(DB.users.some(u=>u.username===f.email.value.split('@')[0].toLowerCase()))return toast('That username is taken','alert-triangle');
    const role=f.role.value;
    const u={id:'u_'+Date.now(),username:f.email.value.split('@')[0].toLowerCase().slice(0,16),name:f.name.value,role,verified:0,color:GENC[Math.floor(Math.random()*GENC.length)],bio:'New here — say hi.',fBase:0,links:[],email:f.email.value};
    DB.users.push(u);save();signIn(u.id,`Welcome to ${DB.meta.brand}, ${u.name.split(' ')[0]}!`)},
  forgot(f){closeModal();toast('Reset link sent to '+f.email.value+' (demo)','mail')},
  comment(f){const c=db.addComment(f.dataset.t,f.dataset.id,f.text.value.trim());f.text.value='';
    const list=DB.comments.filter(x=>x.target===f.dataset.t&&x.targetId===f.dataset.id&&!x.deleted);
    const cl=$('#clist')||$('#pcl-'+f.dataset.id);if(cl)cl.innerHTML=commentList(list);ic();toast('Comment posted','message-square')},
  reply(f){const parent=DB.comments.find(x=>x.id===f.dataset.p);
    const tgt=parent.target==='story'?parent.targetId:parent.targetId;
    db.addComment(parent.target,parent.targetId,f.text.value.trim(),parent.id);f.closest('.replybox').remove();
    const list=DB.comments.filter(x=>x.target===parent.target&&x.targetId===parent.targetId&&!x.deleted);
    const cl=$('#clist')||$('#pcl-'+parent.targetId);if(cl)cl.innerHTML=commentList(list);ic()},
  post(f){db.addPost(f.type.value,f.text.value.trim());toast('Posted to the feed','send');route()},
  report(f){DB.reports.unshift({id:'r_'+Date.now(),targetType:f.t.value,targetId:f.id.value,reporter:me.id,reason:f.reason.value,details:f.details.value.trim(),status:'pending',at:Date.now()});
    DB.users.filter(u=>u.role==='admin').forEach(u=>notify(u.id,'report','A new report needs review.','#/admin/reports'));save();closeModal();toast('Report submitted — thank you','shield')},
  pf(f){me.name=f.name.value.trim()||me.name;me.bio=f.bio.value.trim();save();toast('Profile saved','check')},
  editstory(f){const s=DB.stories.find(x=>x.id===f.dataset.id);s.title=f.title.value.trim()||s.title;s.desc=f.desc.value.trim();s.status=f.status.value;save();toast('Story updated','check');route()},
  gadd(f){const g=f.g.value.trim();if(g&&!DB.genres.includes(g)){DB.genres.push(g);save();toast('Genre added','tags');route()}},
  brand(f){DB.meta.brand=f.brand.value.trim()||'Hatch';DB.meta.accent=f.accent.value;save();applyBrand();toast('Branding updated','check');route()},
};
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form){e.preventDefault();F[f.dataset.form]?.(f)}});
/* editor live wiring */
document.addEventListener('input',e=>{
  if(e.target.id==='ed'){const words=e.target.innerText.trim().split(/\s+/).filter(Boolean).length;
    $('#wc').textContent=words+' words';
    clearTimeout(A._edT);A._edT=setTimeout(()=>{$('#chstat').textContent='Draft saved · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})},900)}
});
document.addEventListener('keydown',e=>{if(e.target.id==='linkurl'&&e.key==='Enter'){e.preventDefault();document.execCommand('createLink',false,e.target.value);e.target.style.display='none';e.target.value=''}});
/* comic page upload + reorder */
document.addEventListener('click',e=>{if(e.target.closest('#dz'))$('#pagefile')?.click()});
document.addEventListener('change',async e=>{
  if(e.target.id==='pagefile'){for(const f of e.target.files)ED.pages.push(await shrink(f));e.target.value='';renderPages();ic();toast(ED.pages.length+' pages ready','image')}
});
document.addEventListener('dragover',e=>{const dz=e.target.closest('#dz');if(dz){e.preventDefault();dz.classList.add('over')}});
document.addEventListener('dragleave',e=>{e.target.closest?.('#dz')?.classList.remove('over')});
document.addEventListener('drop',async e=>{const dz=e.target.closest('#dz');if(dz){e.preventDefault();dz.classList.remove('over');for(const f of e.dataTransfer.files)if(f.type.startsWith('image/'))ED.pages.push(await shrink(f));renderPages();ic()}});
document.addEventListener('dragstart',e=>{const pg=e.target.closest?.('.pg');if(pg){ED.drag=+pg.dataset.i;pg.classList.add('drag')}});
document.addEventListener('dragend',e=>{$$('.pg').forEach(p=>p.classList.remove('drag'))});
document.addEventListener('dragover',e=>{const pg=e.target.closest?.('.pg');if(pg&&ED.drag!==null){e.preventDefault()}});
document.addEventListener('drop',e=>{const pg=e.target.closest?.('.pg');if(pg&&ED.drag!==null){e.preventDefault();const to=+pg.dataset.i;const[m]=ED.pages.splice(ED.drag,1);ED.pages.splice(to,0,m);ED.drag=null;renderPages()}});
function applyBrand(){document.documentElement.style.setProperty('--acc',DB.meta.accent);document.title=`${DB.meta.brand} — Stories Worth Getting Lost In`}
/* helpers used by views defined after use */
function chCommit(sid,num,pub){
  const s=DB.stories.find(x=>x.id===sid);
  const title=$('#chtitle').value.trim()||'Untitled';
  let ch=DB.chapters.find(c=>c.storyId===sid&&c.num===num);
  if(s.type==='novel'){
    const content=$('#ed').innerHTML;
    if(pub&&$('#ed').innerText.trim().split(/\s+/).filter(Boolean).length<20)return toast('A chapter needs at least 20 words to publish','info');
    if(ch){ch.title=title;ch.content=content}else{ch={id:'c_'+sid+'_'+num+'_'+Date.now(),storyId:sid,num,title,content,published:false,deleted:false,at:Date.now()};DB.chapters.push(ch)}
  }else{
    if(pub&&!ED.pages.length)return toast('Upload at least one page to publish','info');
    if(ch){ch.title=title;ch.pages=[...ED.pages]}else{ch={id:'c_'+sid+'_'+num+'_'+Date.now(),storyId:sid,num,title,pages:[...ED.pages],published:false,deleted:false,at:Date.now()};DB.chapters.push(ch)}
  }
  const sched=$('#chsched')?.value;
  if(pub){ch.published=true;ch.at=Date.now();if(sched){ch.scheduledFor=new Date(sched).getTime();ch.published=false}}
  ch.title=title;s.updAt=Date.now();save();
  if(ch.published)notifyFollowers(s);
  toast(ch.published?'Chapter published — followers notified':'Draft saved','rocket');
  location.hash='#/studio/chapters/'+sid;
}
function wizCommit(){
  wizSync();
  const slug=WZ.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'untitled';
  const s={id:'s_'+slug+'_'+Date.now().toString(36),slug:slug+'-'+Date.now().toString(36),type:WZ.type,author:me.id,title:WZ.title.trim(),desc:WZ.desc.trim(),genres:WZ.genres,tags:WZ.genres.map(g=>g.toLowerCase()),status:WZ.status,published:WZ.published,featured:false,premium:WZ.premium,views:0,likeBase:0,rating:'—',ratingCount:0,lang:'English',coverSeed:WZ.coverSeed,createdAt:Date.now(),updAt:Date.now(),deleted:false};
  DB.stories.push(s);
  if(WZ.schedule){DB.chapters.push({id:'c_'+s.id+'_0',storyId:s.id,num:1,title:'Chapter 1',content:novelBody(s.id),pages:[],published:false,scheduledFor:new Date(WZ.schedule).getTime(),deleted:false,at:Date.now()})}
  save();
  toast(WZ.published?'Story published! Add your first chapter.':'Story saved as draft','rocket');
  location.hash='#/studio/chapters/'+s.id;
}
/* original cover seeds for user-created stories */
const _pic=pic;
pic=function(seed,w,h){const s=db.stories?.().find?.(x=>seed===x.slug+'-cover'||x.coverSeed===seed);if(s?.type==='comic')return comicArtwork(s).url;return _pic(s?s.slug:seed,w,h)};
/* boot */
applyBrand();route();
</script>
